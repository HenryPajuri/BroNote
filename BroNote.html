  editorEl.addEventListener("cut", function(e){
    var sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) return;
    var range = sel.getRangeAt(0);
    var frag = range.cloneContents();
    if (!frag.querySelector("figure")) return; // plain text cut works natively
    e.preventDefault();
    var div = document.createElement("div");
    div.appendChild(frag);
    e.clipboardData.setData("text/html", div.innerHTML);
    e.clipboardData.setData("text/plain", div.textContent);
    range.deleteContents();
    syncCurrent(); save();
  });

  // Paste an image straight from the clipboard
  editorEl.addEventListener("paste", function(e){
    var items = (e.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++){
      if (items[i].type.indexOf("image") === 0){
        e.preventDefault();
        var reader = new FileReader();
        reader.onload = function(){ insertFigure(reader.result); };
        reader.readAsDataURL(items[i].getAsFile());
        return;
      }
    }
    // An HTML paste (e.g. from Word): once the browser has inserted it,
    // adopt its images into proper figures and clean out unreadable ones
    setTimeout(function(){
      upgradeFigures();
      syncCurrent();
      save();
    }, 0);
  });

  // ---------- Backup: export / import ----------
  function fileSafe(name){
    return (name || "untitled").replace(/[^a-z0-9]+/gi, "-")
                               .replace(/^-+|-+$/g, "").toLowerCase() || "untitled";
  }

  function exportFile(obj, filename){
    var blob = new Blob([JSON.stringify(obj)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }

  // A shrunk deep copy of the notes for the "-small" export; the stored
  // notes themselves are not touched.
  function shrinkCopyOfData(cb){
    var copy = JSON.parse(JSON.stringify(data));
    var pi = 0;
    function nextPage(){
      if (pi >= copy.pages.length){ cb(copy); return; }
      var p = copy.pages[pi++];
      var tmp = document.createElement("div");
      tmp.innerHTML = p.body || "";
      var imgs = Array.from(tmp.querySelectorAll("img"));
      var ii = 0;
      (function nextImg(){
        if (ii >= imgs.length){ p.body = tmp.innerHTML; nextPage(); return; }
        var im = imgs[ii++];
        var s = im.getAttribute("src") || "";
        compressDataUrl(s, function(ns){
          if (ns !== s) im.setAttribute("src", ns);
          nextImg();
        });
      })();
    }
    nextPage();
  }

  document.getElementById("exportBtn").onclick = function(){
    syncCurrent();
    var stamp = new Date().toISOString().slice(0, 10);
    exportFile(data, "bronote-backup-" + stamp + ".json");
    statusEl.textContent = "Making the small copy…";
    shrinkCopyOfData(function(small){
      exportFile(small, "bronote-backup-" + stamp + "-small.json");
      statusEl.textContent = "Saved";
    });
  };

  var importInput = document.getElementById("importInput");
  document.getElementById("importBtn").onclick = function(){ importInput.click(); };

  importInput.addEventListener("change", function(){
    var file = importInput.files[0];
    importInput.value = "";
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var imported;
      try {
        imported = JSON.parse(reader.result);
        if (!imported || !Array.isArray(imported.pages)) throw new Error();
      } catch(e) {
        notice("That doesn't look like a BroNote backup file.");
        return;
      }
      if (!imported.pages.length){
        notice("That backup file has no pages in it.");
        return;
      }
      // If the app is basically empty, just restore the backup as-is.
      // Otherwise: pages you already have (same identity — e.g. a weekly
      // updated shared file) are refreshed in place, new ones are added,
      // and your own pages are never touched.
      syncCurrent();
      var isEmpty = data.pages.length === 1 &&
                    !data.pages[0].title && !data.pages[0].body;
      var byId = {};
      data.pages.forEach(function(p){ byId[p.id] = p; });
      var newCount = 0, updCount = 0;
      imported.pages.forEach(function(p){
        if (byId[p.id]) updCount++; else newCount++;
      });
      var msg = isEmpty
        ? "Load " + imported.pages.length + " page(s) from this backup?"
        : "Load " + imported.pages.length + " page(s) from this backup?\n\n" +
          (newCount ? newCount + " new" : "") +
          (newCount && updCount ? ", " : "") +
          (updCount ? updCount + " updated in place" : "") + ".";
      dialog(msg, { okText: "Load" }).then(function(yes){
        if (!yes) return;
        if (isEmpty){
          data = imported;
          // the old pages are gone for good, so their undo trail goes too
          deletedOps.forEach(purgeOpHistory);
          deletedOps = [];
          redoDeleted = [];
        } else {
          imported.pages.forEach(function(p){
            var mine = byId[p.id];
            if (mine){
              // same page, newer content — local position, pinning and
              // collapse state stay exactly as the user arranged them
              mine.title = p.title;
              mine.body = p.body;
            } else {
              data.pages.push(p);
              byId[p.id] = p;
            }
          });
        }
        currentId = imported.pages[0].id;
        openPage(currentId);
        save();
      });
    };
    reader.readAsText(file);
  });

  // ---------- Boot ----------
  document.getElementById("addPage").onclick = function(){
    addPage("");
    openPage(currentId);
    titleEl.focus();
  };

  function finishBoot(){
    currentId = data.lastOpen;
    if (!data.pages.length) addPage("My first page");
    if (!data.pages.some(function(p){ return p.id === currentId; })) {
      currentId = data.pages[0].id;
    }
    openPage(currentId);
  }

  openDB().then(function(d){
    db = d;
    return dbGet("data");
  }).then(function(stored){
    // First run on the new storage: bring over notes saved by the old
    // localStorage version, if any.
    if (!stored) stored = loadLocalStorage();
    if (stored && stored.pages) data = stored;
    finishBoot();
  }).catch(function(){
    var stored = loadLocalStorage();
    if (stored && stored.pages) data = stored;
    finishBoot();
  });
})();
</script>
</body>
</html>
